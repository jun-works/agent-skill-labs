<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>폰 크기로 나란히 보기</title><style>:root{color-scheme:light dark;--bg:#fbfaf7;--fg:#201d19;--dim:#6d665b;--line:#e6e0d6;--card:#fff;--hot:#d9541e}@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#f2efe9;--dim:#a9a297;--line:#3a3833;--card:#262420;--hot:#ff8a4c}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all}main{max-width:860px;margin:0 auto;padding:40px 20px 60px}h1{font-size:30px;line-height:1.3;margin:0 0 6px}h2{font-size:20px;margin:28px 0 10px}p{margin:0 0 12px}.dim{color:var(--dim)}a{color:var(--hot)}a:focus-visible{outline:2px solid var(--hot);outline-offset:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0}.card b{display:block;font-size:17px}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg)}.links a.main{border-color:var(--hot);color:var(--hot);font-weight:700}code{font:14px ui-monospace,Menlo,monospace}</style><style>main{max-width:none}.pair{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}figure{margin:0}figcaption{font-weight:700;margin-bottom:6px}iframe{width:390px;height:780px;border:1px solid var(--line);border-radius:16px;background:#fff}@media (max-width:840px){iframe{width:min(390px,90vw)}}</style></head><body><main>
<p><a href="./">← 목록</a></p>
<h1 id="t">폰 크기로 나란히 보기</h1>
<p class="dim">폭 390px 화면입니다. 각 화면 안에서 스크롤할 수 있습니다.</p>
<div class="pair"><figure><figcaption>스킬 없음</figcaption><iframe id="a" title="스킬 없이 만든 화면"></iframe></figure><figure><figcaption>ui-ux-pro-max</figcaption><iframe id="b" title="ui-ux-pro-max로 만든 화면"></iframe></figure></div>
</main><script>
const T={1:'가계부 앱 랜딩',2:'쇼핑몰 매출 대시보드',3:'동물병원 진료 예약'};

</script></body></html>
