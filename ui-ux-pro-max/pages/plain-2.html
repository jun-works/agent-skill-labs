<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소소마켓 · 매출 대시보드</title>
<style>
  /* ---------- Color roles (light) ---------- */
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --hover: rgba(11, 11, 11, 0.04);
    --selected: #f0efec;
    --s1: #2a78d6;  /* 자사몰 / 단일 시리즈 */
    --s2: #eb6834;  /* 스마트스토어 */
    --s3: #1baf7a;  /* 쿠팡 */
    --s4: #eda100;  /* 인스타그램 */
    --prev: #898781;
    --good-text: #006300;
    --bad-text: #d03b3b;
    --shadow: 0 4px 16px rgba(11, 11, 11, 0.08);
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  /* ---------- Dark (OS setting) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink-1: #f0efec;
      --ink-2: #c3c2b7;
      --ink-3: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --hover: rgba(255, 255, 255, 0.06);
      --selected: #2c2c2a;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --prev: #898781;
      --good-text: #0ca30c;
      --bad-text: #d03b3b;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
  }
  /* ---------- Dark (toggle) ---------- */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink-1: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.06);
    --selected: #2c2c2a;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --prev: #898781;
    --good-text: #0ca30c;
    --bad-text: #d03b3b;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink-1);
    font: 14px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
  .btn {
    font: inherit; font-size: 13px; color: var(--ink-1);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }

  /* Filter row — one row, above everything it scopes */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .seg button {
    font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--ink-2);
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
  }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-checked="true"] { background: var(--selected); color: var(--ink-1); font-weight: 600; }
  .select-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  select {
    font: inherit; font-size: 13px; color: var(--ink-1); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 28px 6px 10px;
  }
  .range-text { font-size: 13px; color: var(--ink-2); }

  /* Layout */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-width: 0; }
  .span-12 { grid-column: span 12; }
  .span-7 { grid-column: span 7; }
  .span-5 { grid-column: span 5; }
  .span-4 { grid-column: span 4; }
  .tiles { grid-column: span 12; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1080px) {
    .span-4, .span-5, .span-7 { grid-column: span 6; }
    .span-4.inv { grid-column: span 12; }
  }
  @media (max-width: 760px) {
    .app { padding: 16px 12px 40px; }
    .span-4, .span-5, .span-7, .span-4.inv { grid-column: span 12; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .caption { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
  .view-toggle { font-size: 12px; padding: 4px 10px; }

  /* Hero */
  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin: 4px 0 12px; }
  .hero-value { font-size: 48px; font-weight: 650; line-height: 1.1; letter-spacing: -0.02em; }
  .delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .delta.good { color: var(--good-text); }
  .delta.bad { color: var(--bad-text); }
  .delta.flat { color: var(--ink-2); }
  .delta .vs { font-weight: 400; color: var(--ink-2); margin-left: 4px; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  .key-rect { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .bg-s1 { background: var(--s1); } .bg-s2 { background: var(--s2); }
  .bg-s3 { background: var(--s3); } .bg-s4 { background: var(--s4); }
  .bg-prev { background: var(--prev); }

  /* Charts */
  .chart { width: 100%; overflow: hidden; }
  .chart svg { display: block; }
  .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .x-label { fill: var(--ink-3); font-size: 11px; }
  .line-s1 { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .line-prev { fill: none; stroke: var(--prev); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .area-s1 { fill: var(--s1); opacity: 0.1; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .dot-prev { fill: var(--prev); stroke: var(--surface); stroke-width: 2; }
  .crosshair { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .end-label { fill: var(--ink-2); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .col { fill: var(--s1); transition: opacity .12s; }
  .col.hot { opacity: 0.72; }
  .hit { fill: transparent; cursor: default; }
  .hit:focus { outline: none; }
  .hit:focus-visible { stroke: var(--s1); stroke-width: 2; }
  svg:focus { outline: none; }
  svg:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }

  /* Stat tiles */
  .tile { display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; }
  .tile-label { font-size: 13px; color: var(--ink-2); }
  .tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25; }
  .tile .delta { font-size: 12px; }
  .spark { margin-top: 8px; height: 36px; }
  .spark-line { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; opacity: .7; }

  /* Segmented bar (thin) + channel rows */
  .segbar { display: flex; gap: 2px; height: 8px; margin: 8px 0 16px; }
  .segbar .part { min-width: 0; transition: opacity .12s; }
  .segbar .part:first-child { border-radius: 4px 0 0 4px; }
  .segbar .part:last-child { border-radius: 0 4px 4px 0; }
  .segbar .part:only-child { border-radius: 4px; }
  .segbar .part:hover, .segbar .part:focus-visible { opacity: .75; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .muted { color: var(--ink-2); font-size: 12px; }
  .name-cell { display: flex; align-items: center; gap: 8px; }
  .table-wrap { max-height: 340px; overflow: auto; }
  .table-wrap thead th { position: sticky; top: 0; background: var(--surface); }
  .rank { color: var(--ink-3); font-variant-numeric: tabular-nums; width: 28px; }
  .delta-cell.good { color: var(--good-text); }
  .delta-cell.bad { color: var(--bad-text); }
  .delta-cell.flat { color: var(--ink-2); }

  /* Ranked horizontal bars (HTML) */
  .hbars { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .hbar-row { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; border-radius: 6px; padding: 2px 4px; margin: 0 -4px; }
  .hbar-row:hover { background: var(--hover); }
  .hbar-name { font-size: 13px; color: var(--ink-1); }
  .hbar-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hbar { height: 16px; background: var(--s1); border-radius: 0 4px 4px 0; flex: none; min-width: 2px; }
  .hbar-val { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hbar-val strong { color: var(--ink-1); font-weight: 600; }

  /* Inventory alerts */
  .alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .alerts li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .alerts li:last-child { border-bottom: 0; }
  .alerts svg { margin-top: 2px; }
  .alert-name { font-size: 13px; font-weight: 500; }
  .alert-meta { font-size: 12px; color: var(--ink-2); }
  .badge { font-size: 12px; font-weight: 600; color: var(--ink-1); white-space: nowrap; padding-top: 1px; }

  /* Tooltip */
  .tip {
    position: fixed; z-index: 20; pointer-events: none;
    background: var(--surface); color: var(--ink-1);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
    padding: 8px 10px; font-size: 12px; min-width: 150px;
  }
  .tip[hidden] { display: none; }
  .tip-title { color: var(--ink-2); margin-bottom: 4px; }
  .tip-row { display: flex; align-items: center; gap: 8px; line-height: 1.7; }
  .tip-key { width: 12px; height: 2px; border-radius: 1px; flex: none; background: transparent; }
  .tip-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip-label { color: var(--ink-2); }

  .foot { margin-top: 24px; font-size: 12px; color: var(--ink-3); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>소소마켓 매출 대시보드</h1>
      <p class="sub">2026년 11월 6일(금) 기준 · 예시 데이터</p>
    </div>
    <button class="btn" id="themeBtn" type="button"></button>
  </header>

  <div class="filters" role="toolbar" aria-label="대시보드 필터">
    <div class="seg" role="radiogroup" aria-label="기간" id="periodSeg">
      <button type="button" role="radio" data-period="7">최근 7일</button>
      <button type="button" role="radio" data-period="30">최근 30일</button>
      <button type="button" role="radio" data-period="90">최근 90일</button>
      <button type="button" role="radio" data-period="mtd">이번 달</button>
    </div>
    <label class="select-wrap">판매 채널
      <select id="channelSel">
        <option value="all">전체 채널</option>
      </select>
    </label>
    <span class="range-text" id="rangeText"></span>
  </div>

  <main class="grid">
    <!-- Hero + daily revenue -->
    <section class="card span-12" data-view>
      <div class="card-head">
        <div>
          <h2>매출</h2>
          <p class="caption">일별 매출 · 이번 기간과 직전 기간 비교</p>
        </div>
        <button class="btn view-toggle" type="button" aria-pressed="false">표로 보기</button>
      </div>
      <div class="hero">
        <div class="hero-value" id="heroValue"></div>
        <div class="delta" id="heroDelta"></div>
      </div>
      <div class="view-chart">
        <div class="legend" aria-hidden="true">
          <span><i class="key-line bg-s1"></i>이번 기간</span>
          <span><i class="key-line bg-prev"></i>직전 기간</span>
        </div>
        <div class="chart" id="lineChart"></div>
      </div>
      <div class="view-table table-wrap" hidden id="lineTable"></div>
    </section>

    <!-- KPI tiles -->
    <section class="tiles" id="tiles" aria-label="핵심 지표"></section>

    <!-- Channels -->
    <section class="card span-4">
      <div class="card-head">
        <div>
          <h2>채널별 매출</h2>
          <p class="caption">판매 채널별 비중과 직전 기간 대비 증감</p>
        </div>
      </div>
      <div class="segbar" id="segbar" role="group"></div>
      <div id="channelTable"></div>
    </section>

    <!-- Categories -->
    <section class="card span-4" data-view>
      <div class="card-head">
        <div>
          <h2>카테고리별 매출</h2>
          <p class="caption">매출이 큰 순서</p>
        </div>
        <button class="btn view-toggle" type="button" aria-pressed="false">표로 보기</button>
      </div>
      <div class="view-chart"><div class="hbars" id="catBars"></div></div>
      <div class="view-table" hidden id="catTable"></div>
    </section>

    <!-- Inventory -->
    <section class="card span-4 inv">
      <div class="card-head">
        <div>
          <h2>재고 알림</h2>
          <p class="caption">현재 재고 기준 · 기간 필터와 무관</p>
        </div>
      </div>
      <ul class="alerts" id="alerts"></ul>
    </section>

    <!-- Weekday -->
    <section class="card span-5" data-view>
      <div class="card-head">
        <div>
          <h2>요일별 평균 매출</h2>
          <p class="caption">선택한 기간의 요일별 하루 평균</p>
        </div>
        <button class="btn view-toggle" type="button" aria-pressed="false">표로 보기</button>
      </div>
      <div class="view-chart"><div class="chart" id="wdChart"></div></div>
      <div class="view-table" hidden id="wdTable"></div>
    </section>

    <!-- Top products -->
    <section class="card span-7">
      <div class="card-head">
        <div>
          <h2>인기 상품 TOP 5</h2>
          <p class="caption">매출 기준</p>
        </div>
      </div>
      <div id="productTable"></div>
    </section>
  </main>

  <p class="foot">모든 수치는 화면 구성을 보여주기 위한 예시 값입니다.</p>
</div>

<div class="tip" id="tip" hidden aria-hidden="true"></div>

<script>
(() => {
  'use strict';

  /* ================= Example data ================= */
  const TODAY = new Date(2026, 10, 6);
  const NDAYS = 180;  // 최대 90일 + 직전 90일

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20261106);

  // slot = 고정 색상 순서 (엔티티를 따라감, 순위를 따르지 않음)
  const CHANNELS = [
    { id: 'own',     name: '자사몰',            slot: 1, base: 9,  aov: 56000, conv: 0.032 },
    { id: 'naver',   name: '네이버 스마트스토어', slot: 2, base: 12, aov: 47000, conv: 0.041 },
    { id: 'coupang', name: '쿠팡',              slot: 3, base: 8,  aov: 39000, conv: 0.052 },
    { id: 'insta',   name: '인스타그램 숍',      slot: 4, base: 3,  aov: 51000, conv: 0.018 },
  ];
  const CATEGORIES = ['의류', '잡화', '뷰티', '리빙', '식품'];
  const CAT_W = [0.36, 0.21, 0.17, 0.15, 0.11];
  const WD_F = [1.12, 0.94, 0.97, 1.0, 0.98, 1.05, 1.18]; // 일..토
  const WD_NAME = ['일', '월', '화', '수', '목', '금', '토'];

  const PRODUCTS = [
    { name: '울 블렌드 니트 가디건', cat: 0, price: 59000, share: 0.35 },
    { name: '와이드 코튼 팬츠',     cat: 0, price: 42000, share: 0.30 },
    { name: '오버핏 옥스포드 셔츠', cat: 0, price: 38000, share: 0.35 },
    { name: '캔버스 토트백',       cat: 1, price: 29000, share: 0.45 },
    { name: '가죽 카드지갑',       cat: 1, price: 35000, share: 0.30 },
    { name: '니트 비니',          cat: 1, price: 18000, share: 0.25 },
    { name: '수분 진정 토너 200ml', cat: 2, price: 24000, share: 0.55 },
    { name: '핸드크림 3종 세트',    cat: 2, price: 19000, share: 0.45 },
    { name: '세라믹 머그 2P',      cat: 3, price: 26000, share: 0.40 },
    { name: '린넨 쿠션 커버',      cat: 3, price: 22000, share: 0.60 },
    { name: '수제 그래놀라 500g',   cat: 4, price: 15000, share: 0.60 },
    { name: '콜드브루 원액 1L',     cat: 4, price: 21000, share: 0.40 },
  ];

  const INVENTORY = [
    { name: '캔버스 토트백', opt: '블랙', stock: 2, days: 1, level: 'critical' },
    { name: '울 블렌드 니트 가디건', opt: '오트밀 / M', stock: 4, days: 2, level: 'critical' },
    { name: '수분 진정 토너 200ml', opt: '단품', stock: 11, days: 5, level: 'warning' },
    { name: '세라믹 머그 2P', opt: '아이보리', stock: 9, days: 6, level: 'warning' },
  ];

  const DAYS = [];
  for (let i = 0; i < NDAYS; i++) {
    const date = new Date(TODAY);
    date.setDate(TODAY.getDate() - (NDAYS - 1 - i));
    const trend = 0.85 + 0.3 * (i / (NDAYS - 1));
    const m = date.getMonth(), d = date.getDate();
    let event = 1;
    if (m === 10 && d >= 1 && d <= 3) event = 1.65;      // 11월 가을 세일
    if (m === 8 && d >= 24 && d <= 26) event = 0.55;     // 추석 연휴 (배송 중단)
    if (m === 8 && d >= 18 && d <= 21) event = 1.25;     // 추석 선물 수요
    const ch = {};
    for (const c of CHANNELS) {
      const orders = Math.max(0, Math.round(c.base * trend * WD_F[date.getDay()] * event * (0.78 + 0.44 * rnd())));
      const aov = c.aov * (0.9 + 0.2 * rnd());
      const rev = Math.round(orders * aov / 100) * 100;
      const visitors = Math.max(20, Math.round(Math.max(orders, 1) / (c.conv * (0.85 + 0.3 * rnd()))));
      const refunds = Math.round(orders * 0.028 * (0.3 + 1.4 * rnd()));
      const w = CAT_W.map(x => x * (0.8 + 0.4 * rnd()));
      const ws = w.reduce((a, b) => a + b, 0);
      ch[c.id] = { orders, rev, visitors, refunds, cats: w.map(x => rev * x / ws) };
    }
    DAYS.push({ date, ch });
  }

  /* ================= Helpers ================= */
  const nf = new Intl.NumberFormat('ko-KR');
  const nf1 = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 1 });
  const won = v => '₩' + nf.format(Math.round(v));
  const man = v => v >= 1e8 ? nf1.format(v / 1e8) + '억' : v >= 1e4 ? nf.format(Math.round(v / 1e4)) + '만' : nf.format(Math.round(v));
  const axisWon = v => v === 0 ? '0' : v >= 1e8 ? nf1.format(v / 1e8) + '억' : nf1.format(v / 1e4) + '만';
  const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
  const longDate = d => `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD_NAME[d.getDay()]})`;
  const korDate = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sum = (arr, k) => arr.reduce((a, d) => a + d[k], 0);

  const SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function niceTicks(max, count = 4) {
    const raw = max / count;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    const n = Math.ceil(max / step - 1e-9);
    return Array.from({ length: n + 1 }, (_, k) => k * step);
  }

  /** Delta: { text, cls } — color = direction × whether up is good */
  function delta(cur, prev, { upGood = true, points = false } = {}) {
    let diff, text;
    if (points) {
      diff = (cur - prev) * 100;
      text = Math.abs(diff).toFixed(2) + '%p';
    } else {
      if (!prev) return { text: '–', cls: 'flat', arrow: '' };
      diff = (cur - prev) / prev * 100;
      text = Math.abs(diff).toFixed(1) + '%';
    }
    if (Math.abs(diff) < 0.05) return { text: '0.0' + (points ? '%p' : '%'), cls: 'flat', arrow: '–' };
    const up = diff > 0;
    return { text, arrow: up ? '▲' : '▼', cls: (up === upGood) ? 'good' : 'bad' };
  }
  const deltaText = dl => `${dl.arrow} ${dl.text}`.trim();
  function renderDelta(node, dl, vsText) {
    node.className = 'delta ' + dl.cls;
    node.replaceChildren(document.createTextNode(deltaText(dl)));
    if (vsText) node.append(h('span', 'vs', vsText));
  }

  /* ================= Tooltip ================= */
  const tip = document.getElementById('tip');
  function showTip(title, rows, x, y) {
    tip.replaceChildren(h('div', 'tip-title', title));
    for (const r of rows) {
      const row = h('div', 'tip-row');
      const key = h('span', 'tip-key ' + (r.key ? 'bg-' + r.key : ''));
      row.append(key, h('strong', 'tip-val', r.value), h('span', 'tip-label', r.label));
      tip.appendChild(row);
    }
    tip.hidden = false;
    placeTip(x, y);
  }
  function placeTip(x, y) {
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y + 14;
    if (left + r.width > innerWidth - 8) left = x - 14 - r.width;
    if (top + r.height > innerHeight - 8) top = y - 14 - r.height;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = Math.max(8, top) + 'px';
  }
  function hideTip() { tip.hidden = true; }
  function bindTip(node, getContent) {
    const fromEl = () => { const b = node.getBoundingClientRect(); return [b.left + b.width / 2, b.top]; };
    node.addEventListener('pointerenter', e => { const c = getContent(); showTip(c.title, c.rows, e.clientX, e.clientY); c.on && c.on(); });
    node.addEventListener('pointermove', e => placeTip(e.clientX, e.clientY));
    node.addEventListener('pointerleave', () => { hideTip(); const c = getContent(); c.off && c.off(); });
    node.addEventListener('focus', () => { const c = getContent(); const [x, y] = fromEl(); showTip(c.title, c.rows, x, y); c.on && c.on(); });
    node.addEventListener('blur', () => { hideTip(); const c = getContent(); c.off && c.off(); });
  }

  /* ================= State ================= */
  const state = { period: 30, channel: 'all' };
  let view = null;

  function computeSlice() {
    const n = state.period === 'mtd' ? TODAY.getDate() : state.period;
    const ids = state.channel === 'all' ? CHANNELS.map(c => c.id) : [state.channel];
    const total = day => {
      const t = { date: day.date, orders: 0, rev: 0, visitors: 0, refunds: 0, cats: CATEGORIES.map(() => 0), byCh: {} };
      for (const id of ids) {
        const x = day.ch[id];
        t.orders += x.orders; t.rev += x.rev; t.visitors += x.visitors; t.refunds += x.refunds;
        x.cats.forEach((v, k) => { t.cats[k] += v; });
        t.byCh[id] = x;
      }
      return t;
    };
    return {
      n, ids,
      cur: DAYS.slice(NDAYS - n).map(total),
      prev: DAYS.slice(NDAYS - 2 * n, NDAYS - n).map(total),
    };
  }

  /* ================= Hero ================= */
  function renderHero(v) {
    const cur = sum(v.cur, 'rev'), prev = sum(v.prev, 'rev');
    document.getElementById('heroValue').textContent = won(cur);
    renderDelta(document.getElementById('heroDelta'), delta(cur, prev), `직전 ${v.n}일 대비 (${won(prev)})`);
  }

  /* ================= Stat tiles ================= */
  const TILE_DEFS = [
    { label: '주문 수', calc: d => sum(d, 'orders'), fmt: x => nf.format(x) + '건', upGood: true },
    { label: '객단가', calc: d => sum(d, 'rev') / Math.max(1, sum(d, 'orders')), fmt: won, upGood: true },
    { label: '구매 전환율', calc: d => sum(d, 'orders') / Math.max(1, sum(d, 'visitors')), fmt: x => (x * 100).toFixed(2) + '%', upGood: true, points: true },
    { label: '환불률', calc: d => sum(d, 'refunds') / Math.max(1, sum(d, 'orders')), fmt: x => (x * 100).toFixed(1) + '%', upGood: false, points: true },
  ];
  function buckets(days, k = 12) {
    const n = Math.min(k, days.length), out = [];
    for (let b = 0; b < n; b++) {
      const s = Math.floor(b * days.length / n), e = Math.floor((b + 1) * days.length / n);
      out.push(days.slice(s, e));
    }
    return out;
  }
  function renderTiles(v) {
    const wrap = document.getElementById('tiles');
    wrap.replaceChildren();
    for (const t of TILE_DEFS) {
      const cur = t.calc(v.cur), prev = t.calc(v.prev);
      const card = h('div', 'card tile');
      card.append(h('div', 'tile-label', t.label), h('div', 'tile-value', t.fmt(cur)));
      const dn = h('div');
      renderDelta(dn, delta(cur, prev, t), `직전 ${v.n}일 대비`);
      card.append(dn);
      // sparkline: de-emphasis line, current point in accent
      const series = buckets(v.cur).map(b => t.calc(b));
      const sp = h('div', 'spark');
      card.append(sp);
      wrap.append(card);
      drawSpark(sp, series);
    }
  }
  function drawSpark(box, series) {
    const W = Math.max(80, box.clientWidth), H = 36, pad = 5;
    const min = Math.min(...series), max = Math.max(...series);
    const span = max - min || 1;
    const x = i => pad + (series.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (series.length - 1));
    const y = val => pad + (H - 2 * pad) * (1 - (val - min) / span);
    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
    sv('path', { d: series.map((val, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(val).toFixed(1)).join(''), class: 'spark-line' }, svg);
    const li = series.length - 1;
    sv('circle', { cx: x(li), cy: y(series[li]), r: 4, class: 'dot-s1' }, svg);
    box.replaceChildren(svg);
  }

  /* ================= Daily revenue line ================= */
  function renderLine(v) {
    const box = document.getElementById('lineChart');
    const cur = v.cur, prev = v.prev, n = cur.length;
    const W = Math.max(320, box.clientWidth), H = 290;
    const m = { t: 16, r: 56, b: 30, l: 48 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const max = Math.max(1, ...cur.map(d => d.rev), ...prev.map(d => d.rev));
    const ticks = niceTicks(max, 4), top = ticks[ticks.length - 1];
    const x = i => m.l + (n === 1 ? pw / 2 : i * pw / (n - 1));
    const y = val => m.t + ph - (val / top) * ph;

    const peak = cur.reduce((a, d) => d.rev > a.rev ? d : a, cur[0]);
    const svg = sv('svg', {
      width: W, height: H, viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: 'img',
      'aria-label': `일별 매출 선 차트, ${n}일. 최고 매출은 ${longDate(peak.date)} ${won(peak.rev)}. 좌우 화살표 키로 날짜별 값을 확인할 수 있습니다.`,
    });

    for (const t of ticks) {
      sv('line', { x1: m.l, x2: m.l + pw, y1: y(t), y2: y(t), class: t === 0 ? 'axis-line' : 'grid-line' }, svg);
      sv('text', { x: m.l - 8, y: y(t), class: 'tick', 'text-anchor': 'end', 'dominant-baseline': 'middle' }, svg).textContent = axisWon(t);
    }
    // x labels
    const want = Math.min(n, Math.max(2, Math.floor(pw / 80)));
    const idx = new Set();
    for (let k = 0; k < want; k++) idx.add(Math.round(k * (n - 1) / Math.max(1, want - 1)));
    for (const i of idx) {
      const anchor = n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      sv('text', { x: x(i), y: H - 8, class: 'x-label', 'text-anchor': anchor }, svg).textContent = md(cur[i].date);
    }

    const pts = arr => arr.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.rev).toFixed(1)}`).join('');
    sv('path', { d: pts(cur) + `L${x(n - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`, class: 'area-s1' }, svg);
    if (prev.length === n) sv('path', { d: pts(prev), class: 'line-prev' }, svg);
    sv('path', { d: pts(cur), class: 'line-s1' }, svg);

    // end dot + end label (only the current series' last value)
    const last = cur[n - 1];
    sv('circle', { cx: x(n - 1), cy: y(last.rev), r: 4, class: 'dot-s1' }, svg);
    sv('text', { x: x(n - 1) + 9, y: y(last.rev), class: 'end-label', 'dominant-baseline': 'middle' }, svg).textContent = man(last.rev);

    // crosshair layer
    const hair = sv('g', { visibility: 'hidden' }, svg);
    const hl = sv('line', { y1: m.t, y2: m.t + ph, class: 'crosshair' }, hair);
    const hp = sv('circle', { r: 4, class: 'dot-prev' }, hair);
    const hc = sv('circle', { r: 4, class: 'dot-s1' }, hair);
    const hit = sv('rect', { x: m.l - 6, y: m.t, width: pw + 12, height: ph, class: 'hit' }, svg);
    let active = n - 1;

    function show(i, cx, cy) {
      active = i;
      const d = cur[i], p = prev[i];
      hair.setAttribute('visibility', 'visible');
      hl.setAttribute('x1', x(i)); hl.setAttribute('x2', x(i));
      hc.setAttribute('cx', x(i)); hc.setAttribute('cy', y(d.rev));
      if (p) { hp.setAttribute('cx', x(i)); hp.setAttribute('cy', y(p.rev)); hp.setAttribute('visibility', 'visible'); }
      else hp.setAttribute('visibility', 'hidden');
      const rows = [{ key: 's1', value: won(d.rev), label: `이번 기간 · 주문 ${nf.format(d.orders)}건` }];
      if (p) rows.push({ key: 'prev', value: won(p.rev), label: `직전 기간 (${md(p.date)})` });
      showTip(longDate(d.date), rows, cx, cy);
    }
    function hide() { hair.setAttribute('visibility', 'hidden'); hideTip(); }
    const idxAt = clientX => {
      const r = svg.getBoundingClientRect();
      return n === 1 ? 0 : clamp(Math.round((clientX - r.left - m.l) / (pw / (n - 1))), 0, n - 1);
    };
    const showKey = i => {
      const r = svg.getBoundingClientRect();
      show(i, r.left + x(i), r.top + y(cur[i].rev));
    };
    hit.addEventListener('pointermove', e => show(idxAt(e.clientX), e.clientX, e.clientY));
    hit.addEventListener('pointerleave', hide);
    svg.addEventListener('focus', () => showKey(active));
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', e => {
      let i = active;
      if (e.key === 'ArrowLeft') i--; else if (e.key === 'ArrowRight') i++;
      else if (e.key === 'Home') i = 0; else if (e.key === 'End') i = n - 1;
      else return;
      e.preventDefault();
      showKey(clamp(i, 0, n - 1));
    });

    box.replaceChildren(svg);

    // table view twin
    const tbl = h('table');
    const thead = tbl.createTHead().insertRow();
    for (const [t, num] of [['날짜', 0], ['매출', 1], ['주문', 1], ['직전 기간', 0], ['직전 매출', 1]]) {
      thead.appendChild(h('th', num ? 'num' : '', t));
    }
    const tb = tbl.createTBody();
    for (let i = n - 1; i >= 0; i--) {
      const r = tb.insertRow(), d = cur[i], p = prev[i];
      r.append(h('td', '', longDate(d.date)), h('td', 'num', won(d.rev)), h('td', 'num', nf.format(d.orders) + '건'),
        h('td', '', p ? longDate(p.date) : '–'), h('td', 'num', p ? won(p.rev) : '–'));
    }
    document.getElementById('lineTable').replaceChildren(tbl);
  }

  /* ================= Channels ================= */
  function renderChannels(v) {
    const rows = CHANNELS.filter(c => v.ids.includes(c.id)).map(c => {
      const rev = v.cur.reduce((a, d) => a + d.byCh[c.id].rev, 0);
      const orders = v.cur.reduce((a, d) => a + d.byCh[c.id].orders, 0);
      const prev = v.prev.reduce((a, d) => a + d.byCh[c.id].rev, 0);
      return { c, rev, orders, prev };
    });
    const total = rows.reduce((a, r) => a + r.rev, 0) || 1;
    const pct = r => (r.rev / total * 100).toFixed(1) + '%';

    const bar = document.getElementById('segbar');
    bar.replaceChildren();
    bar.setAttribute('aria-label', '채널별 매출 비중: ' + rows.map(r => `${r.c.name} ${pct(r)}`).join(', '));
    for (const r of rows) {
      if (r.rev <= 0) continue;
      const p = h('div', 'part bg-s' + r.c.slot);
      p.style.flex = `${r.rev} 1 0`;
      p.tabIndex = 0;
      p.setAttribute('role', 'img');
      p.setAttribute('aria-label', `${r.c.name} ${won(r.rev)}, ${pct(r)}`);
      bindTip(p, () => ({ title: r.c.name, rows: [
        { key: 's' + r.c.slot, value: won(r.rev), label: '매출' },
        { value: pct(r), label: '비중' },
        { value: nf.format(r.orders) + '건', label: '주문' },
      ] }));
      bar.appendChild(p);
    }

    const tbl = h('table');
    const hr = tbl.createTHead().insertRow();
    hr.append(h('th', '', '채널'), h('th', 'num', '매출'), h('th', 'num', '비중'), h('th', 'num', '증감'));
    const tb = tbl.createTBody();
    for (const r of rows) {
      const tr = tb.insertRow();
      const nameTd = h('td');
      const nc = h('div', 'name-cell');
      nc.append(h('i', 'key-rect bg-s' + r.c.slot), h('span', '', r.c.name));
      nameTd.append(nc);
      const dl = delta(r.rev, r.prev);
      tr.append(nameTd, h('td', 'num', man(r.rev) + ' 원'), h('td', 'num', pct(r)),
        h('td', 'num delta-cell ' + dl.cls, deltaText(dl)));
    }
    document.getElementById('channelTable').replaceChildren(tbl);
  }

  /* ================= Categories (ranked bars) ================= */
  function renderCategories(v) {
    const vals = CATEGORIES.map((name, k) => ({
      name,
      v: v.cur.reduce((a, d) => a + d.cats[k], 0),
      p: v.prev.reduce((a, d) => a + d.cats[k], 0),
    })).sort((a, b) => b.v - a.v);

        h('td', 'num delta-cell ' + dl.cls, deltaText(dl)));

    document.getElementById('catTable').replaceChildren(tbl);

  /* ================= Weekday columns ================= */
  function renderWeekday(v) {
    const box = document.getElementById('wdChart');
    const order = [1, 2, 3, 4, 5, 6, 0];
    const acc = {};
    for (const wd of order) acc[wd] = { s: 0, c: 0 };
    for (const d of v.cur) { const wd = d.date.getDay(); acc[wd].s += d.rev; acc[wd].c++; }
    const data = order.map(wd => ({ wd, avg: acc[wd].c ? acc[wd].s / acc[wd].c : null, days: acc[wd].c }));

    const W = Math.max(280, box.clientWidth), H = 230;
    const m = { t: 22, r: 8, b: 28, l: 44 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const max = Math.max(1, ...data.map(d => d.avg || 0));
    const ticks = niceTicks(max, 4), top = ticks[ticks.length - 1];
    const y = val => m.t + ph - (val / top) * ph;
    const band = pw / 7;
    const bw = Math.min(24, band * 0.55);

    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': '요일별 하루 평균 매출 막대 차트' });
    for (const t of ticks) {
      sv('line', { x1: m.l, x2: m.l + pw, y1: y(t), y2: y(t), class: t === 0 ? 'axis-line' : 'grid-line' }, svg);
      sv('text', { x: m.l - 8, y: y(t), class: 'tick', 'text-anchor': 'end', 'dominant-baseline': 'middle' }, svg).textContent = axisWon(t);
    }
    const best = data.reduce((a, d) => (d.avg || 0) > (a.avg || 0) ? d : a, data[0]);

    data.forEach((d, i) => {
      const cx = m.l + band * i + band / 2;
      sv('text', { x: cx, y: H - 8, class: 'x-label', 'text-anchor': 'middle' }, svg).textContent = WD_NAME[d.wd];
      if (d.avg == null) return;
      const x0 = cx - bw / 2, y0 = y(0), y1 = y(d.avg);
      const r = Math.min(4, y0 - y1, bw / 2);
      const col = sv('path', {
        d: `M${x0},${y0}V${y1 + r}Q${x0},${y1} ${x0 + r},${y1}H${x0 + bw - r}Q${x0 + bw},${y1} ${x0 + bw},${y1 + r}V${y0}Z`,
        class: 'col',
      }, svg);
      if (d === best) {
        sv('text', { x: cx, y: y1 - 6, class: 'end-label', 'text-anchor': 'middle' }, svg).textContent = man(d.avg);
      }
      const hit = sv('rect', { x: m.l + band * i + 1, y: m.t, width: band - 2, height: ph, class: 'hit', tabindex: 0, role: 'img',
        'aria-label': `${WD_NAME[d.wd]}요일 하루 평균 ${won(d.avg)}, ${d.days}일 기준` }, svg);
      bindTip(hit, () => ({
        title: `${WD_NAME[d.wd]}요일`,
        rows: [{ key: 's1', value: won(d.avg), label: `하루 평균 · ${d.days}일 기준` }],
        on: () => col.classList.add('hot'),
        off: () => col.classList.remove('hot'),
      }));
    });
    box.replaceChildren(svg);

    const tbl = h('table');
    const hr = tbl.createTHead().insertRow();
    hr.append(h('th', '', '요일'), h('th', 'num', '하루 평균 매출'), h('th', 'num', '집계 일수'));
    const tb = tbl.createTBody();
    for (const d of data) {
      const tr = tb.insertRow();
      tr.append(h('td', '', WD_NAME[d.wd] + '요일'), h('td', 'num', d.avg == null ? '–' : won(d.avg)), h('td', 'num', d.days + '일'));
    }
    document.getElementById('wdTable').replaceChildren(tbl);
  }

  /* ================= Products ================= */
  function renderProducts(v) {
    const catCur = CATEGORIES.map((_, k) => v.cur.reduce((a, d) => a + d.cats[k], 0));
    const catPrev = CATEGORIES.map((_, k) => v.prev.reduce((a, d) => a + d.cats[k], 0));
    const list = PRODUCTS.map(p => {
      const qty = Math.round(catCur[p.cat] * p.share / p.price);
      const pqty = Math.round(catPrev[p.cat] * p.share / p.price);
      return { ...p, qty, rev: qty * p.price, prev: pqty * p.price };
    }).sort((a, b) => b.rev - a.rev).slice(0, 5);

    const tbl = h('table');
    const hr = tbl.createTHead().insertRow();
    hr.append(h('th', '', '#'), h('th', '', '상품'), h('th', 'num', '판매량'), h('th', 'num', '매출'), h('th', 'num', '증감'));
    const tb = tbl.createTBody();
    list.forEach((p, i) => {
      const tr = tb.insertRow();
      const nameTd = h('td');
      nameTd.append(h('div', '', p.name), h('div', 'muted', `${CATEGORIES[p.cat]} · ${won(p.price)}`));
      const dl = delta(p.rev, p.prev);
      tr.append(h('td', 'rank', String(i + 1)), nameTd, h('td', 'num', nf.format(p.qty) + '개'), h('td', 'num', won(p.rev)),
        h('td', 'num delta-cell ' + dl.cls, deltaText(dl)));
    });
    document.getElementById('productTable').replaceChildren(tbl);
  }

  /* ================= Inventory (status: icon + label, never color alone) ================= */
  function statusIcon(level) {
    const svg = sv('svg', { width: 16, height: 16, viewBox: '0 0 16 16', 'aria-hidden': 'true' });
    if (level === 'critical') {
      sv('circle', { cx: 8, cy: 8, r: 7, fill: '#d03b3b' }, svg);
      sv('rect', { x: 7, y: 4, width: 2, height: 5, rx: 1, fill: '#ffffff' }, svg);
      sv('circle', { cx: 8, cy: 11.5, r: 1.1, fill: '#ffffff' }, svg);
    } else {
      sv('path', { d: 'M8 1.5 15 14.5H1Z', fill: '#fab219', stroke: '#fab219', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, svg);
      sv('rect', { x: 7, y: 6, width: 2, height: 4.5, rx: 1, fill: '#0b0b0b' }, svg);
      sv('circle', { cx: 8, cy: 12.4, r: 1, fill: '#0b0b0b' }, svg);
    }
    return svg;
  }
  function renderInventory() {
    const ul = document.getElementById('alerts');
    for (const it of INVENTORY) {
      const li = h('li');
      const body = h('div');
      body.append(h('div', 'alert-name', it.name), h('div', 'alert-meta', `${it.opt} · 남은 재고 ${it.stock}개 · 약 ${it.days}일 후 소진 예상`));
      li.append(statusIcon(it.level), body, h('span', 'badge', it.level === 'critical' ? '품절 임박' : '재고 부족'));
      ul.appendChild(li);
    }
  }

  /* ================= Render ================= */
  function renderRange(v) {
    const c0 = v.cur[0].date, c1 = v.cur[v.n - 1].date, p0 = v.prev[0].date, p1 = v.prev[v.n - 1].date;
    document.getElementById('rangeText').textContent =
      `${korDate(c0)} – ${korDate(c1)} (${v.n}일) · 비교: ${korDate(p0)} – ${korDate(p1)}`;
  }
  function renderAll() {
    view = computeSlice();
    renderRange(view);
    renderHero(view);
    renderTiles(view);
    renderLine(view);
    renderChannels(view);
    renderCategories(view);
    renderWeekday(view);
    renderProducts(view);
  }

  // Period filter
  const seg = document.getElementById('periodSeg');
  function syncSeg() {
    for (const b of seg.querySelectorAll('button')) {
      const on = String(state.period) === b.dataset.period;
      b.setAttribute('aria-checked', on);
      b.tabIndex = on ? 0 : -1;
    }
  }
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.period = b.dataset.period === 'mtd' ? 'mtd' : Number(b.dataset.period);
    syncSeg(); renderAll();
  });
  seg.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const btns = [...seg.querySelectorAll('button')];
    const i = btns.findIndex(b => b.getAttribute('aria-checked') === 'true');
    const nb = btns[(i + (e.key === 'ArrowRight' ? 1 : btns.length - 1)) % btns.length];
    nb.click(); nb.focus(); e.preventDefault();
  });

  // Channel filter
  const sel = document.getElementById('channelSel');
  for (const c of CHANNELS) { const o = h('option', '', c.name); o.value = c.id; sel.appendChild(o); }
  sel.addEventListener('change', () => { state.channel = sel.value; renderAll(); });

  // Table-view toggles
  for (const card of document.querySelectorAll('[data-view]')) {
    const btn = card.querySelector('.view-toggle');
    btn.addEventListener('click', () => {
      const showTable = btn.getAttribute('aria-pressed') !== 'true';
      btn.setAttribute('aria-pressed', showTable);
      btn.textContent = showTable ? '차트로 보기' : '표로 보기';
      card.querySelector('.view-chart').hidden = showTable;
      card.querySelector('.view-table').hidden = !showTable;
    });
  }

  // Theme toggle
  const themeBtn = document.getElementById('themeBtn');
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const effective = () => document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light');
  const syncTheme = () => { themeBtn.textContent = effective() === 'dark' ? '라이트 모드' : '다크 모드'; };
  themeBtn.addEventListener('click', () => {
    document.documentElement.dataset.theme = effective() === 'dark' ? 'light' : 'dark';
    syncTheme();
  });
  mq.addEventListener('change', syncTheme);

  // Re-render width-dependent charts on resize
  const lastW = {};
  const ro = new ResizeObserver(entries => {
    let dirty = false;
    for (const en of entries) {
      const w = Math.round(en.contentRect.width);
      if (lastW[en.target.id] !== w) { lastW[en.target.id] = w; dirty = true; }
    }
    if (dirty && view) requestAnimationFrame(() => {
      renderLine(view); renderWeekday(view); renderTiles(view);
    });
  });
  ['lineChart', 'wdChart', 'tiles'].forEach(id => ro.observe(document.getElementById(id)));

  syncSeg();
  syncTheme();
  renderInventory();
  renderAll();
})();
</script>
</body>
</html>
